apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-compute-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-compute-collector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-compute-collector
subjects:
  - kind: ServiceAccount
    name: dashboard-compute-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-compute-collector
